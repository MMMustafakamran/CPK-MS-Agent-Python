name: Daily Auto-Update and Demo Recording

on:
  schedule:
    # Runs every day at 06:00 UTC (11:00 AM PKT / adjust as desired)
    - cron: '0 6 * * *'
  workflow_dispatch:
    inputs:
      run_all_pages:
        description: 'Record ALL 20 pages (default / uncheck to choose specific pages below)'
        required: false
        type: boolean
        default: true
      upgrade_packages:
        description: 'Upgrade packages (ncu -u --peer & uv sync --upgrade)'
        required: false
        type: boolean
        default: false
      fail_on_doc_drift:
        description: 'Fail immediately if doc drift is detected'
        required: false
        type: boolean
        default: false
      custom_args:
        description: 'Or type custom CLI args (e.g. --limit=5)'
        required: false
        type: string
        default: ''

      # Individual Page Selection Checkboxes
      page_quickstart:
        description: 'Page 01: Quickstart'
        type: boolean
        default: false
      page_prebuilt_components:
        description: 'Page 02: Prebuilt Components'
        type: boolean
        default: false
      page_slots:
        description: 'Page 03: Custom Slots'
        type: boolean
        default: false
      page_headless_ui:
        description: 'Page 04: Headless UI'
        type: boolean
        default: false
      page_programmatic_control:
        description: 'Page 05: Programmatic Control'
        type: boolean
        default: false
      page_custom_components:
        description: 'Page 06: Custom Components'
        type: boolean
        default: false
      page_agent_app_context:
        description: 'Page 07: Agent App Context'
        type: boolean
        default: false
      page_copilot_readable:
        description: 'Page 08: Copilot Readable'
        type: boolean
        default: false
      page_copilot_action:
        description: 'Page 09: Copilot Action'
        type: boolean
        default: false
      page_hitl:
        description: 'Page 10: Human In The Loop'
        type: boolean
        default: false
      page_shared_state:
        description: 'Page 11: Shared State'
        type: boolean
        default: false
      page_threads:
        description: 'Page 12: Threads'
        type: boolean
        default: false
      page_inspector:
        description: 'Page 13: Dev Console / Inspector'
        type: boolean
        default: false
      page_agent_mode:
        description: 'Page 14: Agent Mode'
        type: boolean
        default: false
      page_security:
        description: 'Page 15: Security'
        type: boolean
        default: false
      page_auth:
        description: 'Page 16: Auth Bearer'
        type: boolean
        default: false
      page_custom_ai_provider:
        description: 'Page 17: Custom AI Provider'
        type: boolean
        default: false
      page_copilot_runtime:
        description: 'Page 18: Copilot Runtime'
        type: boolean
        default: false
      page_custom_agent_runner:
        description: 'Page 19: Custom Agent Runner'
        type: boolean
        default: false
      page_multi_agent:
        description: 'Page 20: Multi Agent Workflows'
        type: boolean
        default: false

jobs:
  record-workers:
    name: Worker ${{ matrix.shard }}/3
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]

    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      OPENAI_CHAT_MODEL_ID: ${{ vars.OPENAI_CHAT_MODEL_ID || 'gpt-4o-mini' }}
      AZURE_OPENAI_ENDPOINT: ${{ secrets.AZURE_OPENAI_ENDPOINT }}
      AZURE_OPENAI_CHAT_DEPLOYMENT_NAME: ${{ vars.AZURE_OPENAI_CHAT_DEPLOYMENT_NAME }}
      COPILOTKIT_LICENSE_TOKEN: ${{ secrets.COPILOTKIT_LICENSE_TOKEN }}
      INTELLIGENCE_API_KEY: ${{ secrets.INTELLIGENCE_API_KEY }}
      INTELLIGENCE_API_URL: ${{ vars.INTELLIGENCE_API_URL }}
      INTELLIGENCE_GATEWAY_WS_URL: ${{ vars.INTELLIGENCE_GATEWAY_WS_URL }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python 3.12
        run: uv python install 3.12

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: |
            frontend/package-lock.json
            autorecorder/package-lock.json

      - name: Install Playwright & System Chromium Dependencies
        run: |
          cd autorecorder
          npm install
          npx playwright install --with-deps chromium

      - name: Run Automation Pipeline & Record Demos (Shard ${{ matrix.shard }}/3)
        run: |
          # 1. Custom CLI args override everything if provided
          if [ -n "${{ inputs.custom_args }}" ]; then
            RECORD_ARGS="${{ inputs.custom_args }}"
          else
            # 2. Check if individual page checkboxes were selected
            PAGES=()
            [ "${{ inputs.page_quickstart }}" = "true" ] && PAGES+=("quickstart")
            [ "${{ inputs.page_prebuilt_components }}" = "true" ] && PAGES+=("prebuilt-components")
            [ "${{ inputs.page_slots }}" = "true" ] && PAGES+=("slots")
            [ "${{ inputs.page_headless_ui }}" = "true" ] && PAGES+=("headless-ui")
            [ "${{ inputs.page_programmatic_control }}" = "true" ] && PAGES+=("programmatic-control")
            [ "${{ inputs.page_custom_components }}" = "true" ] && PAGES+=("custom-components")
            [ "${{ inputs.page_agent_app_context }}" = "true" ] && PAGES+=("agent-app-context")
            [ "${{ inputs.page_copilot_readable }}" = "true" ] && PAGES+=("copilot-readable")
            [ "${{ inputs.page_copilot_action }}" = "true" ] && PAGES+=("copilot-action")
            [ "${{ inputs.page_hitl }}" = "true" ] && PAGES+=("hitl")
            [ "${{ inputs.page_shared_state }}" = "true" ] && PAGES+=("shared-state")
            [ "${{ inputs.page_threads }}" = "true" ] && PAGES+=("threads")
            [ "${{ inputs.page_inspector }}" = "true" ] && PAGES+=("inspector")
            [ "${{ inputs.page_agent_mode }}" = "true" ] && PAGES+=("agent-mode")
            [ "${{ inputs.page_security }}" = "true" ] && PAGES+=("security")
            [ "${{ inputs.page_auth }}" = "true" ] && PAGES+=("auth")
            [ "${{ inputs.page_custom_ai_provider }}" = "true" ] && PAGES+=("custom-ai-provider")
            [ "${{ inputs.page_copilot_runtime }}" = "true" ] && PAGES+=("copilot-runtime")
            [ "${{ inputs.page_custom_agent_runner }}" = "true" ] && PAGES+=("custom-agent-runner")
            [ "${{ inputs.page_multi_agent }}" = "true" ] && PAGES+=("multi-agent")

            if [ ${#PAGES[@]} -gt 0 ]; then
              JOINED=$(IFS=,; echo "${PAGES[*]}")
              RECORD_ARGS="--pages=$JOINED --shard=${{ matrix.shard }}/3"
            else
              # Default: split all 20 pages across 3 shards
              RECORD_ARGS="--shard=${{ matrix.shard }}/3"
            fi
          fi

          EXTRA_FLAGS=""
          if [ "${{ inputs.upgrade_packages }}" = "true" ]; then
            EXTRA_FLAGS="$EXTRA_FLAGS --upgrade"
          fi
          if [ "${{ inputs.fail_on_doc_drift }}" != "true" ]; then
            EXTRA_FLAGS="$EXTRA_FLAGS --ignore-doc-drift"
          fi

          echo "Running worker shard ${{ matrix.shard }}/3 with flags: $EXTRA_FLAGS $RECORD_ARGS"
          xvfb-run --auto-servernum --server-args="-screen 0 1920x1080x24" node scripts/automate.mjs $EXTRA_FLAGS $RECORD_ARGS

      - name: Publish Shard Report to GitHub Summary
        if: always()
        run: |
          if [ -f "autorecorder/videos/RUN_REPORT.md" ]; then
            echo "### 🧩 Worker Shard ${{ matrix.shard }}/3 Summary" >> $GITHUB_STEP_SUMMARY
            cat autorecorder/videos/RUN_REPORT.md >> $GITHUB_STEP_SUMMARY
          fi

      - name: Upload Shard Recorded Video Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: demo-recordings-shard-${{ matrix.shard }}
          path: |
            autorecorder/videos/*.webm
            autorecorder/videos/RUN_REPORT.md
            autorecorder/videos/RUN_REPORT.json
          if-no-files-found: ignore
          retention-days: 14

  consolidate-recordings:
    name: Consolidate & Merge All Video Artifacts
    needs: record-workers
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Download all shard artifacts
        uses: actions/download-artifact@v4
        with:
          path: all-recordings
          pattern: demo-recordings-shard-*
          merge-multiple: true

      - name: Mux Voiceover Audio onto Readables Demo Video
        run: |
          if [ -f "autorecorder/audio/mspyreadables.m4a" ]; then
            READABLE_VIDEO=$(ls all-recordings/*Readables*.webm 2>/dev/null | head -n 1 || true)
            if [ -n "$READABLE_VIDEO" ]; then
              echo "🎵 Muxing voiceover audio onto $READABLE_VIDEO..."
              ffmpeg -y -i "$READABLE_VIDEO" -i autorecorder/audio/mspyreadables.m4a -c:v copy -c:a aac -map 0:v:0 -map 1:a:0 -shortest "${READABLE_VIDEO}.temp.webm"
              mv "${READABLE_VIDEO}.temp.webm" "$READABLE_VIDEO"
              echo "✅ Successfully added voiceover audio to $READABLE_VIDEO"
            else
              echo "ℹ️ Readables video not in this run; skipping audio mux."
            fi
          fi

      - name: Upload Consolidated Demo Recordings Package
        uses: actions/upload-artifact@v4
        with:
          name: demo-recordings-all-${{ github.sha }}
          path: all-recordings/
          if-no-files-found: ignore
          retention-days: 14
