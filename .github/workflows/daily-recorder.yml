name: Daily Auto-Update and Demo Recording

on:
  # Temporarily disabled daily schedule
  # schedule:
  #   # Runs every day at 06:00 UTC (11:00 AM PKT / adjust as desired)
  #   - cron: '0 6 * * *'
  workflow_dispatch:
    inputs:
      run_all_pages:
        description: 'Record ALL 20 pages (default / uncheck to choose specific pages below)'
        required: false
        type: boolean
        default: true
      upgrade_packages:
        description: 'Upgrade packages (ncu -u --peer & uv sync --upgrade)'
        required: false
        type: boolean
        default: false
      fail_on_doc_drift:
        description: 'Fail immediately if doc drift is detected'
        required: false
        type: boolean
        default: false
      custom_args:
        description: 'Or type custom CLI args (e.g. --limit=5)'
        required: false
        type: string
        default: ''

      # Individual Page Selection Checkboxes
      page_quickstart:
        description: 'Page 01: Quickstart'
        type: boolean
        default: false
      page_prebuilt_components:
        description: 'Page 02: Prebuilt Components'
        type: boolean
        default: false
      page_slots:
        description: 'Page 03: Custom Slots'
        type: boolean
        default: false
      page_headless_ui:
        description: 'Page 04: Headless UI'
        type: boolean
        default: false
      page_programmatic_control:
        description: 'Page 05: Programmatic Control'
        type: boolean
        default: false
      page_inspector:
        description: 'Page 06: Inspector'
        type: boolean
        default: false
      page_display_only:
        description: 'Page 07: Generative UI - Display Only'
        type: boolean
        default: false
      page_interactive:
        description: 'Page 08: Generative UI - Interactive'
        type: boolean
        default: false
      page_tool_rendering:
        description: 'Page 09: Generative UI - Tool Rendering'
        type: boolean
        default: false
      page_state_rendering:
        description: 'Page 10: Generative UI - State Rendering'
        type: boolean
        default: false
      page_frontend_tools:
        description: 'Page 11: App Control - Frontend Tools'
        type: boolean
        default: false
      page_in_app_agent_read:
        description: 'Page 12: Shared State - In-App Agent Read'
        type: boolean
        default: false
      page_in_app_agent_write:
        description: 'Page 13: Shared State - In-App Agent Write'
        type: boolean
        default: false
      page_readables:
        description: 'Page 14: Readables'
        type: boolean
        default: false
      page_auth:
        description: 'Page 15: Auth Bearer'
        type: boolean
        default: false
      page_threads_drawer:
        description: 'Page 16: Rich Threads - Threads Drawer'
        type: boolean
        default: false
      page_threads_headless:
        description: 'Page 17: Rich Threads - Headless Threads'
        type: boolean
        default: false
      page_threads_lifecycle:
        description: 'Page 18: Rich Threads - Thread & History Lifecycle'
        type: boolean
        default: false
      page_copilot_runtime:
        description: 'Page 19: Backend - Copilot Runtime'
        type: boolean
        default: false
      page_ag_ui:
        description: 'Page 20: Backend - AG-UI Protocol Stream'
        type: boolean
        default: false

jobs:
  record-workers:
    name: Worker ${{ matrix.shard }}/3
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]

    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      OPENAI_CHAT_MODEL_ID: ${{ vars.OPENAI_CHAT_MODEL_ID || 'gpt-4o-mini' }}
      AZURE_OPENAI_ENDPOINT: ${{ secrets.AZURE_OPENAI_ENDPOINT }}
      AZURE_OPENAI_CHAT_DEPLOYMENT_NAME: ${{ vars.AZURE_OPENAI_CHAT_DEPLOYMENT_NAME }}
      COPILOTKIT_LICENSE_TOKEN: ${{ secrets.COPILOTKIT_LICENSE_TOKEN }}
      INTELLIGENCE_API_KEY: ${{ secrets.INTELLIGENCE_API_KEY }}
      INTELLIGENCE_API_URL: ${{ vars.INTELLIGENCE_API_URL }}
      INTELLIGENCE_GATEWAY_WS_URL: ${{ vars.INTELLIGENCE_GATEWAY_WS_URL }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python 3.12
        run: uv python install 3.12

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: |
            frontend/package-lock.json
            autorecorder/package-lock.json

      - name: Install Playwright & System Chromium Dependencies
        run: |
          cd autorecorder
          npm install
          npx playwright install --with-deps chromium

      - name: Run Automation Pipeline & Record Demos (Shard ${{ matrix.shard }}/3)
        run: |
          # 1. Custom CLI args override everything if provided
          if [ -n "${{ inputs.custom_args }}" ]; then
            RECORD_ARGS="${{ inputs.custom_args }}"
          else
            # 2. Check if individual page checkboxes were selected
            PAGES=()
            [ "${{ inputs.page_quickstart }}" = "true" ] && PAGES+=("quickstart")
            [ "${{ inputs.page_prebuilt_components }}" = "true" ] && PAGES+=("prebuilt-components")
            [ "${{ inputs.page_slots }}" = "true" ] && PAGES+=("slots")
            [ "${{ inputs.page_headless_ui }}" = "true" ] && PAGES+=("headless-ui")
            [ "${{ inputs.page_programmatic_control }}" = "true" ] && PAGES+=("programmatic-control")
            [ "${{ inputs.page_inspector }}" = "true" ] && PAGES+=("inspector")
            [ "${{ inputs.page_display_only }}" = "true" ] && PAGES+=("display-only")
            [ "${{ inputs.page_interactive }}" = "true" ] && PAGES+=("interactive")
            [ "${{ inputs.page_tool_rendering }}" = "true" ] && PAGES+=("tool-rendering")
            [ "${{ inputs.page_state_rendering }}" = "true" ] && PAGES+=("state-rendering")
            [ "${{ inputs.page_frontend_tools }}" = "true" ] && PAGES+=("frontend-tools")
            [ "${{ inputs.page_in_app_agent_read }}" = "true" ] && PAGES+=("in-app-agent-read")
            [ "${{ inputs.page_in_app_agent_write }}" = "true" ] && PAGES+=("in-app-agent-write")
            [ "${{ inputs.page_readables }}" = "true" ] && PAGES+=("readables")
            [ "${{ inputs.page_auth }}" = "true" ] && PAGES+=("auth")
            [ "${{ inputs.page_threads_drawer }}" = "true" ] && PAGES+=("threads-drawer")
            [ "${{ inputs.page_threads_headless }}" = "true" ] && PAGES+=("threads-headless")
            [ "${{ inputs.page_threads_lifecycle }}" = "true" ] && PAGES+=("threads-lifecycle")
            [ "${{ inputs.page_copilot_runtime }}" = "true" ] && PAGES+=("copilot-runtime")
            [ "${{ inputs.page_ag_ui }}" = "true" ] && PAGES+=("ag-ui")

            if [ ${#PAGES[@]} -gt 0 ]; then
              JOINED=$(IFS=,; echo "${PAGES[*]}")
              RECORD_ARGS="--pages=$JOINED --shard=${{ matrix.shard }}/3"
            else
              # Default: split all 20 pages across 3 shards
              RECORD_ARGS="--shard=${{ matrix.shard }}/3"
            fi
          fi

          EXTRA_FLAGS=""
          if [ "${{ inputs.upgrade_packages }}" = "true" ]; then
            EXTRA_FLAGS="$EXTRA_FLAGS --upgrade"
          fi
          if [ "${{ inputs.fail_on_doc_drift }}" != "true" ]; then
            EXTRA_FLAGS="$EXTRA_FLAGS --ignore-doc-drift"
          fi

          echo "Running worker shard ${{ matrix.shard }}/3 with flags: $EXTRA_FLAGS $RECORD_ARGS"
          xvfb-run --auto-servernum --server-args="-screen 0 1920x1080x24" node scripts/automate.mjs $EXTRA_FLAGS $RECORD_ARGS

      - name: Publish Shard Report to GitHub Summary
        if: always()
        run: |
          if [ -f "autorecorder/videos/RUN_REPORT.md" ]; then
            echo "### 🧩 Worker Shard ${{ matrix.shard }}/3 Summary" >> $GITHUB_STEP_SUMMARY
            cat autorecorder/videos/RUN_REPORT.md >> $GITHUB_STEP_SUMMARY
          fi

      - name: Upload Shard Recorded Video Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: demo-recordings-shard-${{ matrix.shard }}
          path: |
            autorecorder/videos/*.webm
            autorecorder/videos/RUN_REPORT.md
            autorecorder/videos/RUN_REPORT.json
          if-no-files-found: ignore
          retention-days: 14

  consolidate-recordings:
    name: Consolidate & Merge All Video Artifacts
    needs: record-workers
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Download all shard artifacts
        uses: actions/download-artifact@v4
        with:
          path: all-recordings
          pattern: demo-recordings-shard-*
          merge-multiple: true

      - name: Install FFmpeg
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends ffmpeg

      - name: Mux Voiceover Audio onto Readables Demo Video
        run: |
          if [ -f "autorecorder/audio/mspyreadables.m4a" ]; then
            READABLE_VIDEO=$(ls all-recordings/*Readables*.webm 2>/dev/null | head -n 1 || true)
            if [ -n "$READABLE_VIDEO" ]; then
              echo "🎵 Muxing voiceover audio onto $READABLE_VIDEO..."
              ffmpeg -y -i "$READABLE_VIDEO" -i autorecorder/audio/mspyreadables.m4a -c:v copy -c:a libopus -map 0:v:0 -map 1:a:0 -shortest "${READABLE_VIDEO}.temp.webm"
              mv "${READABLE_VIDEO}.temp.webm" "$READABLE_VIDEO"
              echo "✅ Successfully added voiceover audio to $READABLE_VIDEO"
            else
              echo "ℹ️ Readables video not in this run; skipping audio mux."
            fi
          fi

      - name: Upload Consolidated Demo Recordings Package
        uses: actions/upload-artifact@v4
        with:
          name: demo-recordings-all-${{ github.sha }}
          path: all-recordings/
          if-no-files-found: ignore
          retention-days: 14
