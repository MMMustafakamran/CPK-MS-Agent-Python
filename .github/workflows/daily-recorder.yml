name: Daily Auto-Update and Demo Recording

# Manual dispatch used to expose one checkbox per demo page. GitHub caps
# workflow_dispatch at 10 inputs and this workflow declared 24, which made
# every manual run fail before a job started. Page selection is now a single
# comma-separated field; `npm run ci:pages` prints the valid ids.

on:
  schedule:
    # Every day at 06:00 UTC (11:00 AM PKT).
    - cron: '0 6 * * *'
  workflow_dispatch:
    inputs:
      pages:
        description: 'Pages to record (comma-separated ids, blank = all). Run `npm run ci:pages` for the list.'
        required: false
        type: string
        default: ''
      upgrade_packages:
        description: 'Upgrade dependencies (ncu -u --peer & uv sync --upgrade)'
        required: false
        type: boolean
        default: false
      fail_on_doc_drift:
        description: 'Fail immediately if the live docs have drifted'
        required: false
        type: boolean
        default: false
      custom_args:
        description: 'Extra recorder args (e.g. --limit=5). Overrides the pages field.'
        required: false
        type: string
        default: ''

concurrency:
  group: daily-recorder-${{ github.ref }}
  cancel-in-progress: false

jobs:
  record-workers:
    name: Worker ${{ matrix.shard }}/3
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]

    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      OPENAI_CHAT_MODEL_ID: ${{ vars.OPENAI_CHAT_MODEL_ID || 'gpt-4o-mini' }}
      AZURE_OPENAI_ENDPOINT: ${{ secrets.AZURE_OPENAI_ENDPOINT }}
      AZURE_OPENAI_API_KEY: ${{ secrets.AZURE_OPENAI_API_KEY }}
      AZURE_OPENAI_CHAT_DEPLOYMENT_NAME: ${{ vars.AZURE_OPENAI_CHAT_DEPLOYMENT_NAME }}
      COPILOTKIT_LICENSE_TOKEN: ${{ secrets.COPILOTKIT_LICENSE_TOKEN }}
      INTELLIGENCE_API_KEY: ${{ secrets.INTELLIGENCE_API_KEY }}
      INTELLIGENCE_API_URL: ${{ vars.INTELLIGENCE_API_URL }}
      INTELLIGENCE_GATEWAY_WS_URL: ${{ vars.INTELLIGENCE_GATEWAY_WS_URL }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python 3.12
        run: uv python install 3.12

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: |
            frontend/package-lock.json
            autorecorder/package-lock.json

      - name: Install Playwright & System Chromium Dependencies
        run: |
          cd autorecorder
          npm install
          npx playwright install --with-deps chromium

      # ffmpeg lives here rather than in the consolidate job because muxing now
      # happens once, in the worker that produced the video.
      - name: Install FFmpeg
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends ffmpeg

      - name: Validate page selection
        if: inputs.pages != '' && inputs.custom_args == ''
        run: node ci/validate-pages.mjs "${{ inputs.pages }}"

      - name: Record demos (shard ${{ matrix.shard }}/3)
        env:
          INPUT_PAGES: ${{ inputs.pages }}
          INPUT_CUSTOM_ARGS: ${{ inputs.custom_args }}
          INPUT_UPGRADE: ${{ inputs.upgrade_packages }}
          INPUT_FAIL_ON_DRIFT: ${{ inputs.fail_on_doc_drift }}
          SHARD: ${{ matrix.shard }}
        run: |
          set -euo pipefail

          if [ -n "${INPUT_CUSTOM_ARGS:-}" ]; then
            RECORD_ARGS="${INPUT_CUSTOM_ARGS}"
          elif [ -n "${INPUT_PAGES:-}" ]; then
            RECORD_ARGS="--pages=${INPUT_PAGES} --shard=${SHARD}/3"
          else
            RECORD_ARGS="--shard=${SHARD}/3"
          fi

          EXTRA_FLAGS=""
          if [ "${INPUT_UPGRADE:-false}" = "true" ]; then
            EXTRA_FLAGS="$EXTRA_FLAGS --upgrade"
          fi
          if [ "${INPUT_FAIL_ON_DRIFT:-false}" != "true" ]; then
            EXTRA_FLAGS="$EXTRA_FLAGS --ignore-doc-drift"
          fi

          echo "Shard ${SHARD}/3 flags: $EXTRA_FLAGS $RECORD_ARGS"
          xvfb-run --auto-servernum --server-args="-screen 0 1920x1080x24" \
            node ci/automate.mjs $EXTRA_FLAGS $RECORD_ARGS

      - name: Publish Shard Report to GitHub Summary
        if: always()
        run: |
          if [ -f "autorecorder/videos/RUN_REPORT.md" ]; then
            echo "### 🧩 Worker Shard ${{ matrix.shard }}/3 Summary" >> $GITHUB_STEP_SUMMARY
            cat autorecorder/videos/RUN_REPORT.md >> $GITHUB_STEP_SUMMARY
          else
            echo "### 🧩 Worker Shard ${{ matrix.shard }}/3 produced no report" >> $GITHUB_STEP_SUMMARY
          fi

      - name: Upload Shard Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: demo-recordings-shard-${{ matrix.shard }}
          path: |
            autorecorder/videos/*.webm
            autorecorder/videos/RUN_REPORT.md
            autorecorder/videos/RUN_REPORT.json
            autorecorder/videos/logs/*.log
          if-no-files-found: ignore
          retention-days: 14

  consolidate-recordings:
    name: Consolidate & Merge All Video Artifacts
    needs: record-workers
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Download all shard artifacts
        uses: actions/download-artifact@v4
        with:
          path: all-recordings
          pattern: demo-recordings-shard-*
          merge-multiple: true

      - name: Upload Consolidated Demo Recordings Package
        uses: actions/upload-artifact@v4
        with:
          name: demo-recordings-all-${{ github.sha }}
          path: all-recordings/
          if-no-files-found: ignore
          retention-days: 14
